<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totalização Exterior – Eleições 2026</title>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 2rem;
    }
    h1 {
      font-size: 1.8rem;
      margin-top: 0;
      color: #1a1a2e;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .status span {
      font-size: 0.9rem;
      color: #333;
    }
    button {
      background: #0d6efd;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0b5ed7;
    }
    button:disabled {
      background: #6c8ebf;
      cursor: not-allowed;
    }
    .candidato {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #e9ecef;
    }
    .candidato:last-child {
      border-bottom: none;
    }
    .candidato .nome {
      font-weight: 600;
      color: #1a1a2e;
    }
    .candidato .partido {
      font-size: 0.85rem;
      color: #6c757d;
      margin-left: 0.5rem;
    }
    .candidato .votos {
      font-weight: 700;
      color: #0d6efd;
    }
    .candidato .percentual {
      font-size: 0.9rem;
      color: #495057;
      margin-left: 0.5rem;
    }
    .total {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 2px solid #dee2e6;
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: 600;
      color: #1a1a2e;
    }
    .erro {
      color: #dc3545;
      text-align: center;
      margin-top: 1rem;
    }
    .loading {
      text-align: center;
      color: #6c757d;
      margin-top: 1rem;
    }
    .footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #868e96;
      text-align: center;
    }
    .footer a {
      color: #0d6efd;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Totalização no Exterior</h1>
    <p class="subtitle">Eleições 2026 – Presidente (1º turno) – Votos no exterior</p>

    <div class="status">
      <span id="ultimaAtualizacao">Aguardando…</span>
      <button id="btnAtualizar">Atualizar</button>
    </div>

    <div id="resultado"></div>
    <div id="erro" class="erro"></div>
    <div id="loading" class="loading">Carregando dados…</div>

    <div class="total" id="totalGeral" style="display:none;">
      <span>Total de votos válidos</span>
      <span id="totalVotos">0</span>
    </div>

    <div class="footer">
      Dados oficiais do TSE – <a href="https://resultados.tse.jus.br" target="_blank">resultados.tse.jus.br</a><br>
      Última atualização do arquivo: <span id="timestampArquivo">—</span>
    </div>
  </div>

  <script>
    // Configuração: código da eleição para presidente (1º turno) em 2026.
    // Altere conforme necessário (ex.: 545 para 2º turno, 546 para outros cargos).
    const ELEICAO = '544';
    const URL_BASE = `https://resultados.tse.jus.br/oficial/ele2026/${ELEICAO}/dados-simplificados/zz/zz-c0001-e000${ELEICAO}-r.json`;

    const resultadoDiv = document.getElementById('resultado');
    const erroDiv = document.getElementById('erro');
    const loadingDiv = document.getElementById('loading');
    const btnAtualizar = document.getElementById('btnAtualizar');
    const ultimaAtualizacaoSpan = document.getElementById('ultimaAtualizacao');
    const totalGeralDiv = document.getElementById('totalGeral');
    const totalVotosSpan = document.getElementById('totalVotos');
    const timestampArquivoSpan = document.getElementById('timestampArquivo');

    let dadosAtuais = null;

    // Formata números com separador de milhar.
    function formatarNumero(n) {
      return n.toLocaleString('pt-BR');
    }

    // Formata percentual com duas casas decimais.
    function formatarPercentual(p) {
      return p.toFixed(2).replace('.', ',') + '%';
    }

    // Renderiza a lista de candidatos e totais.
    function renderizar(dados) {
      resultadoDiv.innerHTML = '';
      erroDiv.textContent = '';
      loadingDiv.style.display = 'none';

      if (!dados || !dados.cargos || dados.cargos.length === 0) {
        erroDiv.textContent = 'Nenhum dado de cargo encontrado.';
        return;
      }

      // Considera apenas o primeiro cargo (presidente).
      const cargo = dados.cargos[0];
      const candidatos = cargo.candidatos || [];

      // Ordena por votos decrescentes.
      const ordenados = [...candidatos].sort((a, b) => (b.votos || 0) - (a.votos || 0));

      // Calcula total de votos válidos (soma dos votos dos candidatos).
      const totalVotos = ordenados.reduce((acc, c) => acc + (c.votos || 0), 0);

      ordenados.forEach(c => {
        const div = document.createElement('div');
        div.className = 'candidato';

        const nomeSpan = document.createElement('span');
        nomeSpan.className = 'nome';
        nomeSpan.textContent = c.nome || '—';

        const partidoSpan = document.createElement('span');
        partidoSpan.className = 'partido';
        partidoSpan.textContent = c.partido || '';

        const votosSpan = document.createElement('span');
        votosSpan.className = 'votos';
        votosSpan.textContent = formatarNumero(c.votos || 0);

        const percentualSpan = document.createElement('span');
        percentualSpan.className = 'percentual';
        const perc = totalVotos > 0 ? ((c.votos || 0) / totalVotos) * 100 : 0;
        percentualSpan.textContent = formatarPercentual(perc);

        div.appendChild(nomeSpan);
        div.appendChild(partidoSpan);
        div.appendChild(votosSpan);
        div.appendChild(percentualSpan);
        resultadoDiv.appendChild(div);
      });

      // Exibe total geral.
      totalVotosSpan.textContent = formatarNumero(totalVotos);
      totalGeralDiv.style.display = 'flex';

      // Exibe timestamp do arquivo, se disponível.
      if (dados.dg && dados.hg) {
        timestampArquivoSpan.textContent = `${dados.dg} ${dados.hg}`;
      } else {
        timestampArquivoSpan.textContent = '—';
      }

      // Atualiza horário da última consulta.
      const agora = new Date();
      ultimaAtualizacaoSpan.textContent = `Última consulta: ${agora.toLocaleTimeString('pt-BR')}`;
    }

    // Busca os dados da API.
    async function carregarDados() {
      loadingDiv.style.display = 'block';
      erroDiv.textContent = '';
      resultadoDiv.innerHTML = '';
      totalGeralDiv.style.display = 'none';
      btnAtualizar.disabled = true;

      try {
        const resposta = await fetch(URL_BASE + '?t=' + Date.now()); // evita cache
        if (!resposta.ok) {
          throw new Error(`Erro HTTP ${resposta.status}`);
        }
        const json = await resposta.json();
        dadosAtuais = json;
        renderizar(json);
      } catch (e) {
        console.error(e);
        erroDiv.textContent = `Falha ao carregar os dados: ${e.message}. Verifique se a eleição está disponível ou tente novamente mais tarde.`;
        loadingDiv.style.display = 'none';
      } finally {
        btnAtualizar.disabled = false;
      }
    }

    // Evento do botão.
    btnAtualizar.addEventListener('click', carregarDados);

    // Carrega automaticamente ao abrir a página.
    carregarDados();

    // Opcional: atualizar a cada 30 segundos.
    // setInterval(carregarDados, 30000);
  </script>
</body>
</html>
